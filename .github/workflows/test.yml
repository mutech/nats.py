name: test

on:
    workflow_dispatch:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

permissions:
    contents: read

env:
    # No nats-server releases exist for the UDS fork yet, so build it from
    # source and run every job against it (this also surfaces any TCP
    # regression from the UDS changes, not just UDS-specific behaviour).
    NATS_SERVER_FORK_REPO: https://github.com/mutech/nats-server.git
    # Pinned server commit this client was last integrated against. Bumping it is
    # its own commit (integration step of the upstream sync), so a test failure
    # is attributable to either the client change or the server bump.
    # upstream-sync 2026-11-21-2
    NATS_SERVER_FORK_REF: 625dbd5feae0737a8e69b64341ab1e38df9e934f

jobs:
    nats:
        # Python 3.8 and 3.9 are unavailable on Ubuntu 26.04.
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
                nats-server-version: ["latest"]

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "stable"

            - name: Build NATS Server (UDS fork)
              run: |
                  git clone --filter=blob:none "$NATS_SERVER_FORK_REPO" "$RUNNER_TEMP/nats-server-fork"
                  git -C "$RUNNER_TEMP/nats-server-fork" checkout --detach "$NATS_SERVER_FORK_REF"
                  go -C "$RUNNER_TEMP/nats-server-fork" install .
              shell: bash

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.12.2"

            - name: Install dependencies and project
              # Installed outside the workspace: uv.lock is pinned to >=3.13 for the
              # modern packages, so it cannot resolve the 3.8-3.12 legs of this matrix.
              run: |
                  uv venv --no-project --python python
                  uv pip install --python .venv/bin/python --editable ./nats --group ./nats/pyproject.toml:dev

            - name: Run tests
              run: |
                  .venv/bin/python -m pytest -x -vv -s --continue-on-collection-errors ./nats/tests

    project:
        name: ${{ matrix.project }} (python-${{ matrix.python-version }}, nats-server-${{ matrix.nats-server-version }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                python-version: ["3.13"]
                os: ["ubuntu-latest", "macos-latest", "windows-latest"]
                nats-server-version: ["latest"]
                project: ["nats-server", "nats-core", "nats-jetstream", "nats-key-value"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "stable"

            - name: Build NATS Server (UDS fork)
              run: |
                  git clone --filter=blob:none "$NATS_SERVER_FORK_REPO" "$RUNNER_TEMP/nats-server-fork"
                  git -C "$RUNNER_TEMP/nats-server-fork" checkout --detach "$NATS_SERVER_FORK_REF"
                  go -C "$RUNNER_TEMP/nats-server-fork" install .
              shell: bash

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.12.2"

            - name: Install dependencies
              run: uv sync --dev
              working-directory: ${{ matrix.project }}

            - name: Run tests for ${{ matrix.project }}
              run: uv run --no-sync pytest -v -n auto
              working-directory: ${{ matrix.project }}
